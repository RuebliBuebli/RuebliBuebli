<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #1a1a1a; }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 900; font-size: 56px; fill: white; text-transform: uppercase; letter-spacing: 2px; }
    .text-subtitle { font-family: monospace; font-size: 20px; fill: #a3a3a3; letter-spacing: 1px; }
    .text-highlight { fill: #f97316; }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="200" rx="24" />

  <!-- Center Text -->
  <text x="400" y="95" class="text-title" text-anchor="middle">
    RUEBLI<tspan class="text-highlight">BUEBLI</tspan>
  </text>
  <text x="400" y="140" class="text-subtitle" text-anchor="middle">
    > FULLSTACK DEVELOPER _
  </text>
</svg>
